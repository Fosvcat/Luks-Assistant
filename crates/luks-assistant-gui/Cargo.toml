[package]
name = "luks-assistant-gui"
description = "Graphical frontend of luks-assistant (falls back to the TUI in a terminal)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "luks-assistant"
path = "src/main.rs"

[features]
default = []
# Native Qt widgets (KDE look). Needs Qt 6 development files at build time.
qt = ["slint/backend-qt"]

[dependencies]
luks-assistant-core.workspace = true
luks-assistant-sysinfo.workspace = true
luks-assistant-tui.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = "1.18"
