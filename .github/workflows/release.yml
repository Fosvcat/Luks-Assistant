name: Release

# A release is made when
#  - the version in Cargo.toml changes on main (push the version bump, done),
#  - a v* tag is pushed, or
#  - the workflow is started by hand (Actions → Release → Run workflow).
# The tag is always v<version from Cargo.toml>; it is created on the commit
# being released. A tag left behind by a failed run (no release attached)
# is moved to that commit.

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, e.g. v0.2.0 (leave empty to use the version in Cargo.toml)"
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=${INPUT_TAG:-v$version}
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::$tag 与 Cargo.toml 中的版本 $version 不一致（请先修改 Cargo.toml 的 version 并推送）"
            exit 1
          fi
          if ! grep -A1 '^name = "luks-assistant-core"$' Cargo.lock | grep -q "^version = \"$version\"$"; then
            echo "::error::Cargo.lock 仍是旧版本号：请运行 cargo build 后一起提交 Cargo.lock"
            exit 1
          fi
          head=$(git rev-parse HEAD)
          release=true
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            at=$(git rev-parse "$tag^{commit}")
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
                echo "$tag 已发布，跳过（版本号没有变化）"
                release=false
              elif [ "$at" != "$head" ]; then
                echo "::error::$tag 已发布在另一个提交上；请提高版本号"
                exit 1
              fi
            elif [ "$at" != "$head" ]; then
              echo "移动未发布的标签 $tag: $at → $head"
              git tag -f "$tag" "$head"
              git push -f origin "refs/tags/$tag"
            fi
          else
            git tag "$tag" "$head"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build-static:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { arch: aarch64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p luks-assistant-tui
      - name: Package
        run: |
          name=luks-assistant-tui-$TAG-${{ matrix.arch }}-linux-static
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/luks-assistant-tui dist/$name/
          cp LICENSE README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
      # Attestations are unavailable for user-owned private repositories.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.arch }}
          path: dist/*.tar.gz

  build-gui:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    # Ubuntu 22.04 keeps the glibc requirement low (2.35).
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - name: Build
        run: cargo build --release --locked -p luks-assistant-gui -p luks-assistant-helper -p luks-assistant-tui
      - name: Package
        run: |
          name=luks-assistant-$TAG-${{ matrix.arch }}-linux
          mkdir -p dist/$name
          cp target/release/luks-assistant target/release/luks-assistant-helper target/release/luks-assistant-tui dist/$name/
          cp packaging/install.sh packaging/luks-assistant.desktop packaging/io.github.fosvcat.luks-assistant.policy.in dist/$name/
          cp LICENSE README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    needs: [prepare, build-static, build-gui]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" \
              --title "luks-assistant $TAG" --generate-notes
          fi
