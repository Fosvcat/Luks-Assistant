name: Release

# A release is made when
#  - the version in Cargo.toml changes on main (push the version bump, done),
#  - a v* tag is pushed, or
#  - the workflow is started by hand (Actions → Release → Run workflow).
# The tag is always v<version from Cargo.toml>; it is created on the commit
# being released. A tag left behind by a failed run (no release attached)
# is moved to that commit.

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, e.g. v0.2.0 (leave empty to use the version in Cargo.toml)"
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=${INPUT_TAG:-v$version}
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::$tag does not match version $version in Cargo.toml (change version in Cargo.toml and push first)"
            exit 1
          fi
          if ! grep -A1 '^name = "luks-assistant-core"$' Cargo.lock | grep -q "^version = \"$version\"$"; then
            echo "::error::Cargo.lock still has the old version: run cargo build and commit Cargo.lock too"
            exit 1
          fi
          head=$(git rev-parse HEAD)
          release=true
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            at=$(git rev-parse "$tag^{commit}")
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
                echo "$tag is already released, skipping (the version did not change)"
                release=false
              elif [ "$at" != "$head" ]; then
                echo "::error::$tag is already released on another commit; raise the version"
                exit 1
              fi
            elif [ "$at" != "$head" ]; then
              echo "Moving the unreleased tag $tag: $at → $head"
              git tag -f "$tag" "$head"
              git push -f origin "refs/tags/$tag"
            fi
          else
            git tag "$tag" "$head"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # TUI and helper: static musl binaries, run on any distribution.
  build-static:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { arch: aarch64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p luks-assistant-tui -p luks-assistant-helper
      - run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/Luks-Assistant-TUI target/${{ matrix.target }}/release/Luks-Assistant-Helper out/
      - uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.arch }}
          path: out/*

  # GUI: Qt6 Widgets, built on Ubuntu 22.04 (glibc 2.35, Qt 6.2) so it runs
  # with the Qt6 of any current distribution.
  build-gui:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Install Qt
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          # Qt 6.2 on 22.04 needs the GL headers but does not depend on them
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libgl1-mesa-dev libopengl-dev
      - name: Build
        run: |
          cmake -S gui -B gui/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build
          strip gui/build/Luks-Assistant-GUI
      - run: mkdir -p out && cp gui/build/Luks-Assistant-GUI out/
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.arch }}
          path: out/*

  release:
    needs: [prepare, build-static, build-gui]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package Luks-Assistant-<arch>.tar.gz
        run: |
          mkdir -p dist
          for arch in x86_64 aarch64; do
            dir=staging/Luks-Assistant-$arch
            mkdir -p "$dir"
            cp artifacts/gui-$arch/Luks-Assistant-GUI artifacts/static-$arch/Luks-Assistant-TUI \
               artifacts/static-$arch/Luks-Assistant-Helper "$dir/"
            chmod 755 "$dir"/Luks-Assistant-*
            cp packaging/install.sh packaging/Luks-Assistant.desktop \
               packaging/io.github.fosvcat.luks-assistant.policy.in LICENSE README.md "$dir/"
            cp -r packaging/icons "$dir/icons"
            tar -C staging -czf dist/Luks-Assistant-$arch.tar.gz Luks-Assistant-$arch
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      # Attestations are unavailable for user-owned private repositories.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" \
              --title "Luks Assistant $TAG" --generate-notes
          fi
