name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0 (created on the selected branch if missing)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create the tag when started by hand
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG exists"
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi
      - name: Tag matches Cargo.toml version
        run: |
          git checkout -q "$TAG"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi

  build-static:
    needs: check-version
    strategy:
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { arch: aarch64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p luks-assistant-tui
      - name: Package
        run: |
          name=luks-assistant-tui-$TAG-${{ matrix.arch }}-linux-static
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/luks-assistant-tui dist/$name/
          cp LICENSE README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
      # Attestations are unavailable for user-owned private repositories.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.arch }}
          path: dist/*.tar.gz

  build-gui:
    needs: check-version
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    # Ubuntu 22.04 keeps the glibc requirement low (2.35).
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - name: Build
        run: cargo build --release --locked -p luks-assistant-gui -p luks-assistant-helper -p luks-assistant-tui
      - name: Package
        run: |
          name=luks-assistant-$TAG-${{ matrix.arch }}-linux
          mkdir -p dist/$name
          cp target/release/luks-assistant target/release/luks-assistant-helper target/release/luks-assistant-tui dist/$name/
          cp packaging/install.sh packaging/luks-assistant.desktop packaging/io.github.fosvcat.luks-assistant.policy.in dist/$name/
          cp LICENSE README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    needs: [build-static, build-gui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" \
              --title "luks-assistant $TAG" --generate-notes
          fi
