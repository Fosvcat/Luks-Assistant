[workspace]
resolver = "3"
members = [
    "crates/luks-assistant-sysinfo",
    "crates/luks-assistant-core",
    "crates/luks-assistant-tui",
    "crates/luks-assistant-helper",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Fosvcat/Luks-Assistant"
authors = ["Fosvcat"]

[workspace.dependencies]
luks-assistant-sysinfo = { path = "crates/luks-assistant-sysinfo" }
luks-assistant-core = { path = "crates/luks-assistant-core" }
luks-assistant-tui = { path = "crates/luks-assistant-tui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
sha2 = "0.10"
libc = "0.2"
ratatui = "0.30"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
